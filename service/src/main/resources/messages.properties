# Error messages of the service, resolved by ErrorMessageResolver.
#
# Keys:   module.<module>                  display name of the module that raised the error
#         <module>.<error>.technical      for developers and the evidence log
#         <module>.<error>.customer       for the end user
# {name} placeholders are filled from the top-level fields of the error's context. Messages are used as written
# (no MessageFormat), so single quotes need no escaping.

# --- Modules ---
module.feature=Feature
module.project=Project
module.environment=Environment
module.qualifier=Feature Qualifier
module.rule=Feature Rule
module.product=Product
module.user=User
module.evaluation=Evaluation
module.search=Search
module.request=Request
module.data=Data
module.service=Service

