server:
  port: 8080

spring:
  application:
    name: tuna-feature-conf-service

  datasource:
    url: jdbc:h2:mem:featuredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  messages:
    basename: messages
    encoding: UTF-8

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  errors:
    # Error responses always carry status, module, message (customer message), requestId and timestamp.
    # When true they also carry technicalMessage and context. context follows this same flag on purpose: it holds the
    # raw details behind the technical message (ids, inputs, constraint names, SQL states, exception types), which is
    # as internal as the message itself. When false both fields are left out of the JSON (absent, not null).
    # The execution evidence always records the technical message and the masked context, whatever this says.
    include-technical-message: true
